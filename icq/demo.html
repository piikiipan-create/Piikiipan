<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Смайлик-цыплёнок</title>
<style>
  :root { --bg:#e9eef5; --card:#fff; --ink:#1d2430; --muted:#6b7686; --accent:#2f8f3a; --line:#cdd5e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161a21; --card:#222833; --ink:#e8edf5; --muted:#93a0b4; --accent:#4cc65a; --line:#37404f; } }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,sans-serif; padding:16px }
  .win { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; box-shadow:0 8px 28px rgba(0,0,0,.15) }
  .title { background:linear-gradient(#3aa347,#2a7d35); color:#fff; padding:8px 12px; font-weight:600; font-size:14px }
  .stage { display:grid; place-items:center; padding:28px 16px 12px }
  button.smiley { all:unset; cursor:pointer; border-radius:12px; padding:8px; line-height:0; -webkit-tap-highlight-color:transparent }
  button.smiley:focus-visible { outline:3px solid var(--accent) }
  video { width:156px; height:134px; display:block; pointer-events:none }
  .hint { text-align:center; color:var(--muted); font-size:14px; padding:0 16px 8px; min-height:2.8em }
  .row { display:flex; gap:10px; align-items:center; justify-content:center; padding:8px 16px 18px; flex-wrap:wrap }
  label { color:var(--muted); font-size:14px }
  input[type=range] { accent-color:var(--accent); width:140px }
  .state { font-size:13px; color:var(--muted) }
</style>
</head>

  <div class="row">
    <label for="vol">Громкость</label>
    <input id="vol" type="range" min="0" max="1" step="0.05" value="1">
    <span class="state" id="state">стоп</span>
  </div>
</div>
<script>
  const v = document.getElementById('v'), btn = document.getElementById('btn'),
        hint = document.getElementById('hint'), state = document.getElementById('state'),
        vol = document.getElementById('vol');
  function show(playing) {
    btn.setAttribute('aria-pressed', playing);
    state.textContent = playing ? 'играет' : 'стоп';
  }
  async function toggle() {
    if (!v.paused) { v.pause(); v.currentTime = 0; show(false); return; }
    v.muted = false; v.volume = +vol.value;
    try { await v.play(); show(true); hint.textContent = 'Нажмите ещё раз, чтобы остановить'; }
    catch (e) { v.muted = true; try { await v.play(); show(true); hint.textContent = 'Браузер не разрешил звук — играет без него'; } catch (_) { hint.textContent = 'Не удалось проиграть видео'; } }
  }
  btn.addEventListener('click', toggle);
  vol.addEventListener('input', () => { v.volume = +vol.value; });
  v.addEventListener('loadeddata', () => { v.currentTime = 0.4; });
</script>
