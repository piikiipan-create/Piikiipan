<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Цыплёнок-смайлик</title>
  <style>
    .ol { stroke: #3a2a10; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .bob   { transform-origin: 32px 56px; animation: bob 1.2s infinite; }
    .comb  { transform-origin: 34px 24px; animation: wig 1.2s infinite; }
    .pupil { animation: dart 1.2s infinite; }
    .mouth { transform-origin: 32px 46px; animation: chat 0.6s infinite; }
    .hand  { animation: tap 1.2s infinite; }
    @keyframes bob  { 0%,100% { transform: scale(1,1) } 25% { transform: scale(1.04,.94) } 50% { transform: scale(.98,1.04) translateY(-2px) } 75% { transform: scale(1.04,.94) } }
    @keyframes wig  { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-12deg) } 75% { transform: rotate(12deg) } }
    @keyframes dart { 0%,100% { transform: translateX(-1.2px) } 50% { transform: translateX(1.2px) } }
    @keyframes chat { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(.5) } }
    @keyframes tap  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.5px) } }
  </style>
  <g class="bob">
    <g class="comb"><path d="M30 24 Q24 10 34 9 Q44 9 40 19 Q37 14 34 15 Q32 18 35 24 Z" fill="#d9696a" class="ol"/></g>
    <ellipse cx="32" cy="40" rx="26" ry="19" fill="#ffc400" class="ol"/>
    <path d="M12 52 Q32 62 52 52" fill="#4f9a98" class="ol"/>
    <path d="M56 40 q6 -2 5 3 q-2 3 -6 2" fill="#ffc400" class="ol"/>
    <ellipse cx="32" cy="37" rx="4.5" ry="3.5" fill="#ff9a1a" class="ol" stroke-width="2"/>
    <ellipse cx="19" cy="34" rx="6.5" ry="6" fill="#fff" class="ol" stroke-width="2.5"/>
    <ellipse cx="47" cy="30" rx="6.5" ry="6" fill="#fff" class="ol" stroke-width="2.5"/>
    <circle class="pupil" cx="19" cy="35" r="2.4" fill="#222"/>
    <circle class="pupil" cx="47" cy="31" r="2.4" fill="#222"/>
    <path d="M12 26 Q19 22 26 27 M40 22 Q47 18 54 24" fill="none" class="ol" stroke-width="2.5"/>
    <g class="mouth"><path d="M25 48 Q32 43 41 46 Q40 53 32 53 Q26 53 25 48 Z" fill="#6b2f3a" class="ol" stroke-width="2.5"/></g>
    <g class="hand"><path d="M44 52 Q46 44 53 46 Q60 48 57 55 Q52 60 46 57 Z" fill="#ffc400" class="ol" stroke-width="2.5"/></g>
  </g>
</svg>
